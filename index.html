<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillUp — Developer Training</title>
  <link rel="stylesheet" href="css/styles.css?v=5" />
  <!-- modules.js must come first: nav.js and home.js both read the manifest
       from it. Deferred scripts run in document order, so tag order is what
       guarantees that. -->
  <script src="js/modules.js?v=5" defer></script>
  <script src="js/nav.js?v=5" defer></script>
</head>
<body>

  <!-- Filled in by js/nav.js. -->
  <header class="site-header" data-site-header>
    <noscript>
      <div class="header-inner">
        <a class="brand" href="index.html">Skill<span>Up</span></a>
      </div>
    </noscript>
  </header>

  <main>
    <section class="hero">
      <h1>Developer Training Modules</h1>
      <p>Short lessons and quick quizzes covering the languages and protocols you'll run into on the job. Pick a module to get started.</p>
    </section>

    <!-- Tiles are generated by js/home.js from the manifest in js/modules.js.
         Adding a module here is no longer an edit to this file. -->
    <section class="module-grid" data-module-grid></section>

    <noscript>
      <p class="noscript-note">
        This site needs JavaScript — the module list and the quizzes are all
        built in the browser. Please enable it and reload.
      </p>
    </noscript>

    <!-- Backup/restore now lives on the dashboard, next to everything else
         about progress, rather than on the landing page. -->
    <p class="home-dash-link"><a href="dashboard.html">See your full progress dashboard &rarr;</a></p>
  </main>

  <footer class="site-footer">
    <p>SkillUp Training &middot; built with plain HTML, CSS &amp; JS</p>
  </footer>

  <!-- progress.js first: home.js reads best scores through it to put a status
       line on each tile. -->
  <script src="js/progress.js?v=5"></script>
  <script src="js/home.js?v=5"></script>

</body>
</html>
