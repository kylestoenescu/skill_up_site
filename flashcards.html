<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flashcards — SkillUp</title>
  <link rel="stylesheet" href="css/styles.css?v=6" />
  <!-- All page scripts are deferred and listed in dependency order.
       Deferred scripts run after parsing, in document order, so this ordering
       IS the guarantee. Note they must be together: a normal <script> at the
       end of <body> would execute BEFORE any deferred script in <head>. -->
  <script src="js/modules.js?v=6" defer></script>
  <script src="js/nav.js?v=6" defer></script>
  <script src="js/progress.js?v=6" defer></script>
  <script src="js/data-loader.js?v=6" defer></script>
  <script src="js/flashcards.js?v=6" defer></script>
</head>
<body>

  <!-- Filled in by js/nav.js. -->
  <header class="site-header" data-site-header>
    <noscript>
      <div class="header-inner">
        <a class="brand" href="index.html">Skill<span>Up</span></a>
      </div>
    </noscript>
  </header>

  <main>
    <div class="module-header">
      <p class="kicker">Review</p>
      <h1>Flashcards</h1>
    </div>

    <p class="fc-intro">
      Questions you've missed, drilled one at a time across every module. Answer
      one correctly three times in a row and it drops out of the deck.
    </p>

    <p class="dash-storage-warning" data-fc-storage-warning hidden>
      This browser isn't allowing local storage, so this session won't be saved.
    </p>

    <!-- One filter row above the thing it scopes. -->
    <div class="fc-controls">
      <label class="fc-filter-label" for="fc-filter">Module</label>
      <select id="fc-filter" class="fc-filter" data-fc-filter></select>
      <span class="fc-progress" data-fc-progress></span>
    </div>

    <div data-fc-stage></div>

    <noscript>
      <p class="noscript-note">
        Flashcards are built in the browser from your saved progress, so this
        page needs JavaScript. Please enable it and reload.
      </p>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>SkillUp Training &middot; built with plain HTML, CSS &amp; JS</p>
  </footer>


</body>
</html>
